name: 🐾 Build & Deploy IMMORTAIL™

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time, don't cancel in-progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------
  # BUILD
  # ----------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
        # Only upload artifact on main branch push (not PRs)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

  # ----------------------------------------------------------------
  # DEPLOY (main branch only)
  # ----------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
